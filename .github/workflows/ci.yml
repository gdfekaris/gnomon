name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm 11.1 crashes resolving vitest's peer set (null edgesOut); use current npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      # The index generator's tests cross-check against tools/gnomon-check.py.
      - run: python3 -m pip install --quiet pyyaml
      - run: npm test
      - name: Validate the brain template and the reference fixture with the CLI
        run: |
          npm run build:cli
          npm run validate:template
          npm run validate:fixture
      - name: The CLI tarball holds only the built CLI, its README, and package.json
        run: |
          cd packages/cli
          test "$(node dist/gnomon.js --version)" = "gnomon-cli $(node -p "require('./package.json').version")"
          npm pack --dry-run --json | node -e '
            const out = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const pkg = Array.isArray(out) ? out[0] : out;
            const files = pkg.files.map((f) => f.path).sort();
            const want = ["README.md", "dist/gnomon.js", "package.json"];
            if (JSON.stringify(files) !== JSON.stringify(want)) { console.error("tarball:", files); process.exit(1); }
            console.log("tarball ok:", files.join(", "));'
      - name: Build the app
        run: npm run build
        env:
          VITE_BASE: /gnomon/
      - name: Playwright flows against the demo brain
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -w packages/app

  # TODO(spec §18): deploy job with actions/deploy-pages once GitHub Pages is
  # enabled for this repository; publish gnomon-cli to npm on release tags.
