name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm 11.1 crashes resolving vitest's peer set (null edgesOut); use current npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      # The index generator's tests cross-check against tools/gnomon-check.py.
      - run: python3 -m pip install --quiet pyyaml
      - run: npm test
      - name: Validate the brain template and the reference fixture with the CLI
        run: |
          npm run build:cli
          npm run validate:template
          npm run validate:fixture
      - name: The CLI tarball holds only the built CLI, its README, and package.json
        run: |
          cd packages/cli
          test "$(node dist/gnomon.js --version)" = "gnomon-cli $(node -p "require('./package.json').version")"
          tgz=$(npm pack --silent 2>/dev/null | tail -1)
          files=$(tar -tzf "$tgz" | sed 's|^package/||' | LC_ALL=C sort | tr '\n' ' ')
          rm -f "$tgz"
          echo "tarball: $files"
          test "$files" = "README.md dist/gnomon.js package.json "
      - name: Build the app
        run: npm run build
        env:
          VITE_BASE: /gnomon/
      - name: Playwright flows against the demo brain
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -w packages/app
      # Spec §18: the built app is the Pages site at gdfekaris.github.io/gnomon/
      # (Vite base /gnomon/ above). Uploaded on every run; deployed only from main.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/app/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

