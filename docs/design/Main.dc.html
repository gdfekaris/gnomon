<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <style>
    body { margin: 0; background: #fff; color: #000; font-family: 'Pixelify Sans', 'Chicago', 'Geneva', system-ui, sans-serif; }
    a { color: #000; } a:hover { color: #000; }
    x-dc { display: block; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0 / 4px 4px; padding: 52px 6px 6px 6px; overflow: hidden;">
  <div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0; background: #fff; border: 1px solid #000; box-shadow: 1px 1px 0 #000;">
    <div style="display: flex; align-items: center; gap: 8px; height: 19px; padding: 0 5px; border-bottom: 1px solid #000; background: repeating-linear-gradient(#000 0 1px, #fff 1px 2px) 0 3px / 100% calc(100% - 6px) no-repeat, #fff;">
      <div style="width: 11px; height: 11px; box-sizing: border-box; border: 1px solid #000; background: #fff; box-shadow: 0 0 0 1px #fff;"></div>
      <div style="flex-grow: 1; display: flex; justify-content: center;"><span style="background: #fff; padding: 0 7px; font-size: 14px; font-weight: 600; line-height: 19px;">Gnomon</span></div>
      <div style="width: 11px; height: 11px; box-sizing: border-box; border: 1px solid #000; background: #fff; box-shadow: 0 0 0 1px #fff;"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 14px 14px 12px 14px; flex-grow: 1; min-height: 0;">
      <h2 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 24px;">Capture</h2>
      <div style="display: flex; align-items: center; gap: 10px; border: 1px solid #000; padding: 8px 10px; font-size: 15px; line-height: 18px;">
        <svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path d="M6.5 1.5h3v6h4v2l-4 5h-3l-4-5v-2h4z" fill="none" stroke="#000"/><path d="M8 4v4" stroke="#000"/></svg>
        <span>All clear. Capture something.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-height: 0;">
        <span style="font-size: 15px; line-height: 18px;">Passage</span>
        <div style="display: flex; border: 1px solid #000; flex-grow: 1; min-height: 160px; background: #fff;">
          <div style="flex-grow: 1; padding: 8px 9px; font-size: 16px; line-height: 20px; color: #7a7a7a;">Paste the passage exactly as you found it.</div>
          <div style="display: flex; flex-direction: column; width: 16px; border-left: 1px solid #000;">
            <div style="height: 16px; border-bottom: 1px solid #000;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path d="M8 4l4 4H4z" fill="#000"/></svg></div>
            <div style="flex-grow: 1; background: repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0 / 2px 2px;"></div>
            <div style="height: 16px; border-top: 1px solid #000;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path d="M8 12l4-4H4z" fill="#000"/></svg></div>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 15px; line-height: 18px;">Note <span style="color: #7a7a7a;">(optional)</span></span>
        <div style="border: 1px solid #000; padding: 7px 9px; font-size: 16px; line-height: 20px; color: #7a7a7a; background: #fff;">Where it came from, why it struck you</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="border: 1px solid #000; border-radius: 7px; padding: 7px 14px; font-size: 15px; line-height: 18px; background: #fff;">Attach a file…</div>
        <span style="font-size: 13px; line-height: 16px; color: #7a7a7a;">optional, up to 20.0 MB</span>
      </div>
      <div style="display: flex; justify-content: center; padding: 6px 0 4px 0;">
        <div style="border: 1px solid #000; border-radius: 8px; padding: 10px 28px; font-size: 16px; font-weight: 600; line-height: 20px; background: #fff; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000; border-radius: 9px;">Save to inbox</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid #000;"><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 50px; background: #000; color: #fff; border-left: 0;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="3.5" y="2.5" width="9" height="12" fill="none" stroke="#fff" stroke-width="1"/><rect x="6" y="1" width="4" height="3" fill="#fff"/><path d="M6 7.5h4M6 9.5h4M6 11.5h3" fill="none" stroke="#fff" stroke-width="1"/></svg><span style="font-size: 10px; line-height: 10px;">Capture</span></div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 50px; background: #fff; color: #000; border-left: 1px solid #000;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path d="M1.5 4.5h5l2 2h6v7h-13z" fill="none" stroke="#000" stroke-width="1"/><path d="M1.5 7.5h13" fill="none" stroke="#000" stroke-width="1"/></svg><span style="font-size: 10px; line-height: 10px;">Browse</span></div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 50px; background: #fff; color: #000; border-left: 1px solid #000;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path d="M2.5 9.5v4h11v-4" fill="none" stroke="#000" stroke-width="1"/><path d="M2.5 9.5h3l1 2h3l1-2h3" fill="none" stroke="#000" stroke-width="1"/><path d="M8.5 1v6M6 5l2.5 2.5L11 5" fill="none" stroke="#000" stroke-width="1"/></svg><span style="font-size: 10px; line-height: 10px;">Inbox</span></div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 50px; background: #fff; color: #000; border-left: 1px solid #000;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="3.5" y="1.5" width="9" height="13" fill="none" stroke="#000" stroke-width="1"/><path d="M5.5 8.5l2 2 3.5-3.5" fill="none" stroke="#000" stroke-width="1"/></svg><span style="font-size: 10px; line-height: 10px;">Proposals</span></div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 50px; background: #fff; color: #000; border-left: 1px solid #000;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="2" width="3" height="3" fill="#000"/><rect x="1" y="7" width="3" height="3" fill="#000"/><rect x="1" y="12" width="3" height="3" fill="#000"/><path d="M6 3.5h9M6 8.5h9M6 13.5h9" fill="none" stroke="#000" stroke-width="1"/></svg><span style="font-size: 10px; line-height: 10px;">Sets</span></div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 50px; background: #fff; color: #000; border-left: 1px solid #000;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" fill="none" stroke="#000" stroke-width="1"/><path d="M4.5 11.5v3l3-3" fill="none" stroke="#000" stroke-width="1"/><path d="M4 5.5h8M4 8.5h5" fill="none" stroke="#000" stroke-width="1"/></svg><span style="font-size: 10px; line-height: 10px;">Reason</span></div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 50px; background: #fff; color: #000; border-left: 1px solid #000;"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path d="M5.5 2v12M10.5 2v12" fill="none" stroke="#000" stroke-width="1"/><rect x="3" y="5" width="5" height="3" fill="#000"/><rect x="8" y="9" width="5" height="3" fill="#000"/></svg><span style="font-size: 10px; line-height: 10px;">Settings</span></div></div>
  </div>
</div>
</x-dc>
</body>
</html>
